<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bunk Calculator · vkit</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <header>
    <a class="back-link" href="../../index.html">← All tools</a>
    <h1>Bunk Calculator</h1>
  </header>

  <main>
    <div class="panel">
      <label for="attended">Lectures attended</label>
      <input type="number" id="attended" placeholder="e.g. 31">

      <label for="held">Lectures held</label>
      <input type="number" id="held" placeholder="e.g. 36">

      <button id="calculate">Calculate</button>

      <div class="result" id="result"></div>
    </div>
  </main>

  <script src="../../js/theme.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
