<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment Tracker · vkit</title>

</head>
<body>

    <a class="back-link" href="../../index.html">← All tools</a>

      <label for="new-assignment">New assignment</label>

    </div>
